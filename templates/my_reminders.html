<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reminders</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>My Reminders</h1>
        <a href="{{ url_for('auth.logout') }}" class="exit-btn">Exit</a>
        
        {% if reminders %}
            <table class="reminders-table">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Date & Time</th>
                        <th>Repeat</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                {% for r in reminders %}
                    <tr>
                        <td>{{ r[2] }}</td>
                        <td>{{ r[3] }}</td>
                        <td>{{ r[4] }}</td>
                        <td>{{ r[5] }}</td>
                        <td>{{ 'Sent' if r[6] == 1 else 'Pending' }}</td>
                        <td>
                            <form action="{{ url_for('reminders.delete_reminder', reminder_id=r[0]) }}" method="post">
                                <button type="submit" class="delete-btn">Delete</button>
                            </form>
                        </td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>
        {% else %}
            <p>No reminders found for this email.</p>
        {% endif %}

        <a href="{{ url_for('reminders.set_reminder') }}" class="back-button">← Set a New Reminder</a>
    </div>
</body>
</html>
